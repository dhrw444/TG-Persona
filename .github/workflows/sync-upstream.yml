name: Sync upstream

# GitHub 不提供 fork 自动同步，只能自己定时调 merge-upstream。
# 只做快进：fork 有独有提交时接口返回 409，这里直接失败而不是强推。
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward from upstream
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "缺少 secrets.SYNC_TOKEN：fork 的 GITHUB_TOKEN 无权调用 merge-upstream，必须用 PAT。" >&2
            exit 1
          fi

          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/merge-upstream" \
            -d '{"branch":"main"}')

          cat "$body"; echo

          if [ "$code" != "200" ]; then
            if [ "$code" = "409" ]; then
              echo "::error::fork 有上游没有的提交，无法快进。需人工 rebase/merge。"
            else
              echo "::error::merge-upstream 返回 $code"
            fi
            exit 1
          fi
