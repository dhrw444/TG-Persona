name: Sync upstream

# GitHub 不提供 fork 自动同步，只能自己定时调 merge-upstream。
#
# 为什么不能用 github.token：上游的 .github/workflows/ 里有 workflow 文件，
# 合并它们需要 workflows 权限；而 github.token 拿不到这个权限 ——
# `workflows` 不是 permissions 的合法键（实测报 "Unexpected value 'workflows'"）。
# 表现为 HTTP 422：
#   refusing to allow a GitHub App to create or update workflow
#   `.github/workflows/regression.yml` without `workflows` permission
# 所以必须用带 workflow scope 的 PAT，存为仓库 secret SYNC_TOKEN。
#
# 实测行为（临时双仓库跑过）：
#   - fork 落后且无冲突        → 200 merge_type=fast-forward
#   - fork 有独有提交但无冲突  → 200 merge_type=merge（自动建 merge commit）
#   - 两边改同一处            → 409，接口不自动解决
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync from upstream
        env:
          REPO: ${{ github.repository }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -eu
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::error::缺少 secrets.SYNC_TOKEN。github.token 无权写 workflow 文件，必须用带 workflow scope 的 PAT。"
            exit 1
          fi

          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/merge-upstream" \
            -d '{"branch":"main"}')

          cat "$body"; echo
          echo "HTTP $code"

          if [ "$code" != "200" ]; then
            case "$code" in
              409) echo "::error::上游改动与本仓库冲突，接口无法自动解决。需人工合并一次，之后定时同步自动恢复。" ;;
              422) echo "::error::422 —— 多为令牌缺少 workflow scope（合并 .github/workflows/ 下的文件需要它）。" ;;
              401) echo "::error::401 —— SYNC_TOKEN 已失效，需重新签发并更新 secret。" ;;
              404) echo "::error::404 —— 令牌无权访问该仓库，或分支名不对。" ;;
              *)   echo "::error::merge-upstream 返回 $code" ;;
            esac
            exit 1
          fi
