name: Sync upstream

# GitHub 不提供 fork 自动同步，只能自己定时调 merge-upstream。
# 上游前进时接口返回 fast-forward；fork 有独有提交时它自己建 merge commit。
# 只有真冲突才 409 —— 那时失败退出，等人处理，不 force 推。
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward from upstream
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::error::缺少 secrets.SYNC_TOKEN。fork 的 GITHUB_TOKEN 无权调用 merge-upstream，必须用 PAT（Contents: write）。"
            exit 1
          fi

          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/merge-upstream" \
            -d '{"branch":"main"}')

          cat "$body"; echo

          if [ "$code" != "200" ]; then
            if [ "$code" = "409" ]; then
              echo "::error::上游改动与 fork 冲突，自动合并失败。需人工处理后再启用定时同步。"
            else
              echo "::error::merge-upstream 返回 $code（401=令牌失效 403=权限不足 404=仓库或分支不对）"
            fi
            exit 1
          fi
