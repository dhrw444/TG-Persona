name: Sync upstream

# GitHub 不提供 fork 自动同步，只能自己定时调 merge-upstream。
# fork 自带 github.token 在 contents: write 下即可调用（已实测 HTTP 200），
# 不需要 PAT。上游前进时快进；fork 有独有提交时它自己建 merge commit；
# 只有真冲突才 409 —— 那时失败退出等人处理，不 force 推。
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward from upstream
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/merge-upstream" \
            -d '{"branch":"main"}')

          cat "$body"; echo
          echo "HTTP $code"

          if [ "$code" != "200" ]; then
            if [ "$code" = "409" ]; then
              echo "::error::上游改动与 fork 冲突，自动合并失败。需人工处理后才会恢复。"
            else
              echo "::error::merge-upstream 返回 $code（401=令牌失效 403=权限不足 404=仓库或分支不对）"
            fi
            exit 1
          fi
