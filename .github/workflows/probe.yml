name: Sync upstream (probe)

# 临时探针：验证 fork 自带的 GITHUB_TOKEN 能否调用 merge-upstream。
# 结论记录完后删除本文件。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call merge-upstream with github.token
        env:
          REPO: ${{ github.repository }}
        run: |
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/merge-upstream" \
            -d '{"branch":"main"}')
          echo "HTTP $code"
          cat "$body"; echo
